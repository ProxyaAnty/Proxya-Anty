[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxya-anty"
version = "1.0.6"
description = "Control the Proxya Anty desktop application from Python."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Proxya" }]
requires-python = ">=3.9"
keywords = ["antidetect", "browser", "fingerprint", "automation", "proxy", "playwright"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://proxya.co/anty"
Documentation = "https://proxya.co/anty"
Source = "https://github.com/ProxyaAnty/Proxya-Anty"
Issues = "https://github.com/ProxyaAnty/Proxya-Anty/issues"

[tool.hatch.build]
ignore-vcs = true
include = ["proxya_anty.py", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
only-include = ["proxya_anty.py"]
sources = ["."]

[tool.hatch.build.targets.sdist]
# Hatchling's standard sdist always includes the nearest .gitignore and does
# not allow excluding it. The export creates a public-safe one at repository
# root, and the boundary scan below validates its contents with every file.
include = ["proxya_anty.py", "pyproject.toml", "README.md", "LICENSE"]

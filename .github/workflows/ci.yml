name: Public SDK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  boundary-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify public boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e engine
          test ! -e launcher
          test ! -e fingerprint-catalogue
          test ! -e devices.json
          ! find . -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.dmg' -o -name '*.msi' -o -name '*.tar.gz' -o -name '*.pem' \) | grep -q .
          ! rg -l 'GOCSPX-[A-Za-z0-9_-]{8,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|npm_[A-Za-z0-9]{30,}' .

      - name: Node SDK
        run: |
          node --check sdk/node/index.mjs
          node --check sdk/node/cdpguard.mjs
          cd sdk/node
          npm pack --dry-run

      - name: MCP
        run: |
          npm ci --prefix mcp
          npm audit --omit=dev --prefix mcp
          node --check mcp/index.js
          cd mcp
          npm pack --dry-run

      - name: Python SDK
        run: |
          python -m py_compile sdk/python/proxya_anty.py
          python -m pip install --disable-pip-version-check build
          python -m build sdk/python
